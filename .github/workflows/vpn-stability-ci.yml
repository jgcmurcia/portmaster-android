name: VPN stability build

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate live Safing SPN dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://api.account.safing.io/api/v1/health >/tmp/account-health
          curl --fail --silent --show-error --max-time 30 https://updates.safing.io/all/intel/intel.json >/tmp/legacy-intel.json
          curl --fail --silent --show-error --max-time 30 https://updates.safing.io/intel.v3.json >/tmp/intel-v3.json

          echo "Account health:"
          cat /tmp/account-health
          echo

          grep -Fq "all/intel/spn/main-intel.yaml" /tmp/legacy-intel.json
          echo "OK legacy SPN main-intel"

          grep -Fq '"Filename": "geoipv4.mmdb"' /tmp/intel-v3.json
          grep -Fq '"Filename": "geoipv6.mmdb"' /tmp/intel-v3.json
          echo "OK current GeoIP v4/v6 artifacts"

      - name: Set up Java 17 for Android tools
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # Go 1.20 is end-of-life and misses years of stdlib security fixes.
      # 1.26 remains supported alongside Go 1.27 and is new enough to run the
      # current govulncheck while being a smaller compatibility jump for this
      # legacy gomobile project than 1.27.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
          cache-dependency-path: go/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Set up Java 11 for legacy Android build
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Install pinned gomobile toolchain
        working-directory: go
        run: |
          MOBILE_VERSION=v0.0.0-20230531173138-3c911d8e3eda
          go install golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve Go module graph
        working-directory: go
        run: |
          go mod download
          go mod download golang.org/x/mobile
          go list -f '{{.Dir}}' golang.org/x/mobile/bind

      - name: Build Go Android bindings
        working-directory: go
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_USER: github-actions
          BUILD_HOST: github-actions
          BUILD_DATE: ${{ github.event.repository.updated_at }}
          BUILD_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir -p ../android/app/libs
          chmod +x ./build
          ./build

      # Scan the exact ARM64 Go shared object generated by gomobile. Source mode
      # is misleading here because Android-only Portmaster files and compatibility
      # shims are injected during ./build and go/compat intentionally contains
      # snippets for more than one upstream package.
      - name: Audit exact Android Go binary
        working-directory: go
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          rm -rf /tmp/golib-audit
          mkdir -p /tmp/golib-audit
          unzip -q ../android/app/libs/golib.aar 'jni/arm64-v8a/libgojni.so' -d /tmp/golib-audit
          "$(go env GOPATH)/bin/govulncheck" -mode=binary /tmp/golib-audit/jni/arm64-v8a/libgojni.so | tee /tmp/govulncheck.txt

      - name: Install web dependencies
        run: npm ci

      - name: Audit production web dependencies
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high | tee /tmp/npm-audit-production.txt

      - name: Build web UI
        run: npm run build -- --configuration production

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Android lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace

      - name: Generate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portmaster-android-security-reports
          path: |
            /tmp/govulncheck.txt
            /tmp/npm-audit-production.txt
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portmaster-android-vpn-stability-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
