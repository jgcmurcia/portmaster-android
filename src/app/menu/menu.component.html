<ion-header>
  <ion-toolbar>
    <ion-title>Portmaster</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item button routerLink="/menu/enabled-apps" detail="true">
      <ion-icon name="apps-outline" slot="start"></ion-icon>
      <ion-label>Apps using Portmaster / SPN</ion-label>
    </ion-item>
    <ion-item button routerLink="/menu/spn-routing" detail="true">
      <ion-icon name="earth-outline" slot="start"></ion-icon>
      <ion-label>SPN exit country</ion-label>
    </ion-item>
    <ion-item button routerLink="/menu/user-info" detail="true">
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-label>Safing account</ion-label>
    </ion-item>
    <ion-item button (click)="openVPNSettings()" detail="true">
      <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
      <ion-label>Android VPN settings</ion-label>
    </ion-item>
    <ion-item button (click)="openBugReport()" detail="true">
      <ion-icon name="bug-outline" slot="start"></ion-icon>
      <ion-label>Bug report</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
